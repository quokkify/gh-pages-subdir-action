name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Shell and metadata lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo actionlint_checksums.txt "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep -F " actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint_checksums.txt | sha256sum -c -
          tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
      - name: Validate shell and Action metadata
        run: |
          bash -n deploy-gh-pages-subdir.sh tests/integration.sh
          shellcheck deploy-gh-pages-subdir.sh tests/integration.sh
          actionlint
      - name: Validate Release Please config schema
        run: |
          npx --yes --package release-please@latest release-please debug-config \
            --config-file .github/release-please/config.json \
            --manifest-file .github/release-please/manifest.json \
            --repo-url https://github.com/quokkify/gh-pages-subdir-action
      - name: Validate Release Please bootstrap and manifest transition guard
        env:
          INPUT_EVENT_NAME: ${{ github.event_name }}
          INPUT_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 tests/release-please-guard.py \
            --config .github/release-please/config.json \
            --manifest .github/release-please/manifest.json \
            --event-name "$INPUT_EVENT_NAME" \
            --event-path "$INPUT_EVENT_PATH"
      - name: Check diff whitespace
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            git diff-tree --check --root "$HEAD_SHA"
          else
            git diff --check "$BASE_SHA..$HEAD_SHA"
          fi

  test:
    name: Bare-remote integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run deterministic integration tests
        run: |
          bash tests/integration.sh
          python3 tests/release-please-guard.py --simulate

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan history and current tree
        run: |
          gitleaks git --redact --no-banner .
          gitleaks dir --redact --no-banner .

  required:
    name: Validation pipeline complete
    if: ${{ always() }}
    needs: [lint, test, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation stage
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
        run: |
          [[ "$LINT_RESULT" == success && "$TEST_RESULT" == success && "$GITLEAKS_RESULT" == success ]] || {
            echo "One or more required validation stages did not succeed." >&2
            exit 1
          }
