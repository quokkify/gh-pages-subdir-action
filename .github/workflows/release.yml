name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: quokkify/project-toolkit/.github/workflows/release-please.yml@0aa342c76151a05eaf5598446997333e5e8585ff # v2.5.3
    with:
      mode: manifest
      config-file: .github/release-please/config.json
      manifest-file: .github/release-please/manifest.json
