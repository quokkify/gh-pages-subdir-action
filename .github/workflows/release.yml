name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    uses: quokkify/project-toolkit/.github/workflows/release-please.yml@1f6c1378f2dd7cadf32d398e4f4de5c82bf015f7 # v2.12.1
    with:
      mode: manifest
      config-file: .github/release-please/config.json
      manifest-file: .github/release-please/manifest.json
